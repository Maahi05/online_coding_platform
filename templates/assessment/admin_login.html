{% extends 'base.html' %}

{% block title %}Administrator Login - PyAssessPro{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-4 border-bottom border-danger">
                <i class="fa-solid fa-shield-halved fs-1 text-danger mb-2"></i>
                <h4 class="mb-0 fw-bold">Admin & Instructor Portal</h4>
                <p class="text-white-50 small mb-0">Authorized management access only</p>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'admin_login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Admin Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Admin username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Admin password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-danger btn-lg fw-semibold">
                            <i class="fa-solid fa-unlock-keyhole me-2"></i> Enter Admin Console
                        </button>
                    </div>

                    <div class="text-center">
                        <a href="{% url 'student_login' %}" class="small text-muted text-decoration-none">
                            <i class="fa-solid fa-arrow-left me-1"></i> Return to Student Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
